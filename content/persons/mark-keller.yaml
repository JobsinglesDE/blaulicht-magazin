faqItems:
  - question: Wer ist Mark Kellers Ehefrau?
    answer: "Mark Keller war seit 1992 mit Tülin Keller verheiratet. Die beiden trennten sich, lebten aber lange Jahre noch als Patchwork-Familie zusammen — auch weil Tülin an Parkinson erkrankte. Die Scheidung wurde erst später offiziell. Heute lebt Mark Keller mit seiner Lebensgefährtin Anna zusammen, pflegt aber weiterhin ein enges familiäres Miteinander in Überlingen."
  - question: Ist Mark Keller Sänger?
    answer: "Ja, Mark Keller ist neben seiner Schauspielkarriere auch als Sänger aktiv. Den ersten grossen Auftritt hatte er 1989 als Dean-Martin-Imitator in der Rudi Carrell Show. Zuvor arbeitete er drei Jahre als Leadsänger der Big Band der Bundeswehr. Er hat mehrere Solo-Alben veröffentlicht und tritt regelmässig bei Konzerten auf — zuletzt etwa mit der Vogtland Philharmonie."
  - question: Wie alt ist Mark Keller?
    answer: "Mark Keller wurde am 5. Mai 1965 in Überlingen am Bodensee geboren. Im Jahr 2026 ist er 61 Jahre alt. Seit über 17 Jahren spielt er Dr. Alexander Kahnweiler in «Der Bergdoktor» — und ist damit einer der dienstältesten Schauspieler der ZDF-Erfolgsserie."
takeaways:
  - "Mark Keller spielt seit 2008 Dr. Alexander Kahnweiler in «Der Bergdoktor» (ZDF) — als bester Freund von Hauptfigur Dr. Martin Gruber gehört er zum unverzichtbaren Kern der Serie."
  - "Als Schauspieler und Sänger lebt er ein Doppelleben: Millionen kennen ihn als TV-Arzt, doch auf der Bühne ist der 61-Jährige ein leidenschaftlicher Performer mit eigenen Alben und Orchestertourneen."
  - "Sein ungewöhnliches Familienleben zeigt: Patchwork funktioniert — Mark Keller lebt mit Ex-Frau Tülin, Partnerin Anna und Söhnen Aaron und Joshua in Überlingen zusammen und nennt es «glückliche Patchwork-Familie»."
