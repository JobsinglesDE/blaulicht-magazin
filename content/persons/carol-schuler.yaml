intro: "Carol Schuler spielt seit Oktober 2020 die Kommissarin Tessa Ott im Tatort Zürich (SRF/ARD) — und hat das Schweizer Ermittlungsduo mit Anna Pieri Zuercher zu einem der erfolgreichsten Krimi-Gespanne im deutschsprachigen Fernsehen gemacht. Privat lebt die Winterthurerin als Schauspielerin und Musikerin in Berlin."
