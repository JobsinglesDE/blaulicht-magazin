faqItems:
  - question: Wer ist Carol Schuler im Tatort?
    answer: "Carol Schuler spielt im Tatort Zürich die Kommissarin Tessa Ott — seit Oktober 2020, als die erste Folge «Züri brännt» ausgestrahlt wurde. Sie bildet mit Anna Pieri Zuercher (Isabelle Grandjean) das Ermittlungsduo, das zum meistgesehenen Schweizer Tatort-Duo avanciert ist."
  - question: Wie alt ist Carol Schuler?
    answer: "Carol Schuler wurde am 23. Januar 1987 in Winterthur geboren. Im Jahr 2026 ist sie 39 Jahre alt. Den Stadtkulturpreis ihrer Heimatstadt Winterthur erhielt sie 2024."
  - question: Hat Carol Schuler einen Freund?
    answer: "Carol Schuler hält ihr Privatleben sehr bedeckt und macht keine öffentlichen Aussagen zu Beziehungen oder einem Partner. Die Schauspielerin lebt in Berlin und ist vor allem über ihre künstlerische Arbeit — Theater, Film und Musik — bekannt."
  - question: Was macht Carol Schuler ausser Tatort?
    answer: "Neben dem Tatort Zürich ist Carol Schuler festes Ensemblemitglied der Schaubühne Berlin. Ausserdem ist sie als Musikerin aktiv: mit der Soul/Boogaloo-Band «El Cartel» und der Swingband «Chloé et les Enfants Terribles». 2020 erhielt sie für die Netflix-Serie «Skylines» den Grimme-Preis."
takeaways:
  - "Carol Schuler hat Tessa Ott seit 2020 zu einer der markantesten Polizistinnen im deutschsprachigen TV gemacht — impulsiv, direkt, menschlich."
  - "Privat ist sie nicht nur Schauspielerin: Als Musikerin tritt sie mit zwei Bands auf und verkörpert das kreative Doppelleben einer Vollblut-Künstlerin."
  - "Grimme-Preis, Schweizer Filmpreis, Stadtkulturpreis Winterthur — Carol Schulers Auszeichnungen spiegeln eine Karriere, die weit über den Tatort hinausgeht."
