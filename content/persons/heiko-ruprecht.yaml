intro: "Heiko Ruprecht spielt seit 2008 Hans Gruber — den bodenständigen Bruder von Dr. Martin Gruber — in der ZDF-Serie «Der Bergdoktor». Der deutsche Schauspieler aus Friedrichshafen ist ausgebildet am Salzburger Mozarteum und bringt klassische Theatererfahrung auf den Bildschirm."
