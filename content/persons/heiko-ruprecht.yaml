faqItems:
  - question: Wer spielt Hans Gruber im Bergdoktor?
    answer: "Heiko Ruprecht spielt seit 2008 Hans Gruber, den Bruder von Dr. Martin Gruber (Hans Sigl), in der ZDF-Serie «Der Bergdoktor». Ruprecht wurde 1972 in Friedrichshafen geboren und absolvierte seine Schauspielausbildung am Salzburger Mozarteum."
  - question: Wer ist Heiko Ruprechts Frau?
    answer: "Heiko Ruprecht ist mit Nicole Prommer verheiratet. Die beiden lernten sich 2009 auf einer Geburtstagsparty kennen. Nicole Prommer ist ausgebildete Heilpraktikerin und Sportwissenschaftlerin und betreibt eine Faszientherapie-Praxis in Olching bei München."
  - question: Wie alt ist Heiko Ruprecht?
    answer: "Heiko Ruprecht wurde 1972 in Friedrichshafen geboren. Er ist damit Jahrgang 1972 und zum Zeitpunkt der Staffel 20 von «Der Bergdoktor» (2026) 53 oder 54 Jahre alt — je nachdem, ob sein Geburtstag im Jahr bereits war."
  - question: Seit wann spielt Heiko Ruprecht im Bergdoktor?
    answer: "Heiko Ruprecht spielt Hans Gruber seit 2008, als die ZDF/ORF-Koproduktion «Der Bergdoktor» erstmals ausgestrahlt wurde. Er ist damit von Anfang an dabei und gehört zum festen Kern der Gruber-Familie auf dem Berghof."
  - question: Was macht Heiko Ruprecht neben dem Bergdoktor?
    answer: "Neben den Bergdoktor-Drehs in Ellmau steht Heiko Ruprecht regelmässig auf deutschen Theaterbühnen. Er tritt in Tournee-Produktionen auf — etwa 2026 in der Komödie «53 Sonntage» im Hamburger Winterhuder Fährhaus — und spricht Hörbücher, für die er 2018 für den Deutschen Hörbuchpreis nominiert wurde."
takeaways:
  - "Heiko Ruprecht spielt seit 2008 Hans Gruber in «Der Bergdoktor» — als Martins Bruder ist er das Herz der Gruber-Familie auf dem Berghof in Tirol."
  - "Der Friedrichshafener Schauspieler ist klassisch ausgebildet: Mozarteum Salzburg, Ulmer Stadttheater, Bayerisches Staatstheater — und bringt dieses Fundament auf den Bildschirm."
  - "Privat lebt Heiko Ruprecht bodenständig in München mit seiner Frau Nicole Prommer und zwei gemeinsamen Töchtern — eine echte Familie abseits des TV-Rummels."
