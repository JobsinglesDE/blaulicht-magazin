intro: "Monika Baumgartner spielt seit 2008 die Gruber-Mutter Lisbeth in der ZDF-Serie «Der Bergdoktor» — und ist das emotionale Herz der beliebten Alpenserie. Hinter der bodenständigen Volksschauspielerin steckt eine jahrzehntelange Theater- und Fernsehkarriere, die weit über Tirol hinausgeht."
