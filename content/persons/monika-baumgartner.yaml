faqItems:
  - question: Wer ist Monika Baumgartner im Bergdoktor?
    answer: "Monika Baumgartner spielt seit 2008 Elisabeth «Lisbeth» Gruber, die Mutter von Dr. Martin Gruber (Hans Sigl) und Hans Gruber. Als Familienoberhaupt der Grubers ist sie das emotionale Zentrum der ZDF-Serie «Der Bergdoktor» — warmherzig, bodenständig und mit viel bayerischem Charme."
  - question: Wie alt ist Monika Baumgartner?
    answer: "Monika Baumgartner wurde am 19. Juli 1951 in München geboren. Sie ist Jahrgang 1951 und damit im Jahr 2026 bereits 74 Jahre alt. Trotz ihres Alters ist sie weiterhin festes Ensemble-Mitglied im Bergdoktor und auf Münchner Theaterbühnen aktiv."
  - question: Ist Monika Baumgartner verheiratet und hat sie Kinder?
    answer: "Monika Baumgartner ist nicht verheiratet und hat keine eigenen Kinder — ein Thema, das sie selbst offen angesprochen hat. Seit rund 27 Jahren ist sie mit dem Juristen Hans Böhmer zusammen, mit dem sie in Gröbenzell bei München lebt. Ihre kurze Ehe in den 1990er Jahren endete nach dem Seitensprung ihres damaligen Mannes."
takeaways:
  - "Monika Baumgartner ist seit 2008 als Lisbeth Gruber das Herz der Gruber-Familie im «Bergdoktor» — und damit fast so lange dabei wie Hans Sigl selbst."
  - "Ihre Karriere begann lange vor dem ZDF: Am Nationaltheater Mannheim, am Hamburger Thalia Theater und den Münchner Kammerspielen baute sie sich ein solides Fundament als Volksschauspielerin."
  - "Der Bayerische Verdienstorden (2011) und die Tassilo-Medaille (2025) bestätigen: Monika Baumgartner ist eine Institution der bayerischen Theaterkultur — weit über den Bildschirm hinaus."
