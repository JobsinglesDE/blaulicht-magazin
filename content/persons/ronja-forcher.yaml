intro: "Ronja Forcher spielt seit 2008 die Rolle der Lilli Gruber in der ZDF-Serie «Der Bergdoktor» — und ist damit seit Kindheitstagen ein fester Teil der beliebtesten Familienserie im deutschsprachigen Fernsehen. Die österreichische Schauspielerin und Sängerin ist längst weit mehr als ein TV-Gesicht."
