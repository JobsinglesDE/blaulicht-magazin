faqItems:
  - question: Wie alt ist Ronja Forcher?
    answer: "Ronja Forcher wurde am 7. Juni 1996 in Innsbruck, Tirol geboren. Sie ist damit Jahrgang 1996 und feierte 2026 ihren 30. Geburtstag — ein Meilenstein, den sie als Schauspielerin und Sängerin mit einer treuen Fangemeinde teilt."
  - question: Hat Ronja Forcher einen Freund oder ist sie verheiratet?
    answer: "Ronja Forcher ist seit August 2022 mit dem Schauspieler Felix Briegel verheiratet. Die beiden sind ein diskretes Paar und halten ihr Privatleben weitgehend aus der Öffentlichkeit heraus. Vor ihrer Hochzeit wurde sie in Medienberichten öfter nach ihrem «Freund» gefragt — die Antwort ist heute: Ehemann Felix."
  - question: Seit wann spielt Ronja Forcher den Bergdoktor?
    answer: "Ronja Forcher ist seit der ersten Staffel im Jahr 2008 als Lilli Gruber in «Der Bergdoktor» dabei. Sie war damals noch ein Kind und ist buchstäblich mit der Serie aufgewachsen. Mehr als 15 Jahre später gehört sie zu den dienstältesten Mitgliedern des Ensembles."
takeaways:
  - "Ronja Forcher spielt Lilli Gruber seit 2008 in «Der Bergdoktor» (ZDF) — sie ist mit der Rolle und der Serie aufgewachsen und gehört zum festen Kern des Ensembles."
  - "Neben der Schauspielerei hat sie eine Musikkarriere gestartet: Debütsingle «Danke» (2021) und Album «Meine Reise» (2022) über Universal Music/Electrola."
  - "Seit August 2022 ist sie mit Schauspieler Felix Briegel verheiratet. 2025 erschien ihre Autobiografie «Für immer an meiner Seite» bei Knaur."
