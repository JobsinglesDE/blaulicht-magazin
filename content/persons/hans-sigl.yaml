faqItems:
  - question: Wer ist Hans Sigls Frau?
    answer: "Hans Sigl ist seit Juni 2008 mit Susanne Sigl (geborene Kemmler) verheiratet. Sie ist Fotografin und Musikerin. Das Paar lebt am Ammersee in Bayern."
  - question: Wie alt ist Hans Sigl?
    answer: "Hans Sigl wurde am 7. Juli 1969 in Rottenmann, Steiermark geboren. Er ist damit Jahrgang 1969 und zum Zeitpunkt der Staffel 20 von «Der Bergdoktor» (2026) 56 Jahre alt."
  - question: Was macht Hans Sigl privat?
    answer: "Privat lebt Hans Sigl sehr zurückgezogen am Ammersee in Bayern. Er schätzt Natur und Familienleben. Mit seiner Frau Susanne und ihrer gemeinsamen Patchwork-Familie mit drei Söhnen führt er ein bodenständiges Leben abseits des Rampenlichtglanz."
  - question: Seit wann spielt Hans Sigl den Bergdoktor?
    answer: "Hans Sigl spielt Dr. Martin Gruber in «Der Bergdoktor» seit 2008, als die ZDF/ORF-Koproduktion erstmals ausgestrahlt wurde. Im Jahr 2026 läuft bereits Staffel 19, eine Jubiläumsstaffel 20 ist in Planung."
  - question: Hat Hans Sigl Kinder?
    answer: "Hans Sigl hat einen leiblichen Sohn namens Nepomuk Jim aus seiner früheren Beziehung mit Schauspielerin Katja Keller. Seine Ehefrau Susanne brachte ihre Söhne Jonas und Niklas in die Ehe — gemeinsam bilden sie eine Patchwork-Familie."
takeaways:
  - "Hans Sigl ist seit 2008 als Dr. Martin Gruber das Gesicht von «Der Bergdoktor» (ZDF) — und hat die Serie zu einer der erfolgreichsten deutschen TV-Serien gemacht."
  - "Privat lebt er bodenständig am Ammersee mit Ehefrau Susanne und ihrer Patchwork-Familie mit drei Söhnen — Liebe im zweiten Anlauf als Vorbild."
  - "Vier Romy-Awards und zwei Goldene Hennen bestätigen: Hans Sigl gehört zu den beliebtesten Schauspielern im deutschsprachigen Fernsehen."
