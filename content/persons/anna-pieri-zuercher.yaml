faqItems:
  - question: Wer ist Anna Pieri Zürcher im Tatort?
    answer: "Anna Pieri Zürcher spielt im Tatort Zürich die Kommissarin Isabelle Grandjean — seit Oktober 2020, als die erste Folge «Züri brännt» auf SRF und Das Erste ausgestrahlt wurde. Sie bildet mit Carol Schuler (Tessa Ott) das Zürcher Ermittlungsduo."
  - question: Was hat Anna Pieri Zürcher privat gemacht?
    answer: "Anna Pieri Zürcher lebt im Waadtland mit ihrem Mann, dem Kameramann und Regisseur Pietro Zürcher, und ihrem Sohn Salomon. Sie arbeitet auch hinter der Kamera: Gemeinsam mit Pietro drehte sie den Kurzfilm «Cherubs», der 2025/26 mehrere internationale Festivalpreise gewann und für den Schweizer Filmpreis nominiert wurde."
  - question: Wie alt ist Anna Pieri Zürcher?
    answer: "Anna Pieri Zürcher wurde 1979 in Biel geboren. Sie ist damit Jahrgang 1979 und zum Zeitpunkt der aktuellen Tatort-Staffel (2026) 46 oder 47 Jahre alt. Ihr genaues Geburtsdatum ist nicht öffentlich bekannt."
  - question: Was hat Anna Pieri Zürcher vor dem Tatort gemacht?
    answer: "Vor dem Tatort war Anna Pieri Zürcher vor allem auf den Theaterbühnen der Romandie aktiv — in Genf, Lausanne und Paris. Sie spielte unter anderem Gretchen, Marianne und Ophelia. Im Film war sie ab 2004 zu sehen («Paul s'en va»), bevor sie 2019 den Schweizer Fernsehfilmpreis als beste Hauptdarstellerin für die Serie «Double vie» gewann."
takeaways:
  - "Anna Pieri Zürcher verkörpert seit 2020 Kommissarin Isabelle Grandjean im Tatort Zürich — eine Figur, die Pflichtgefühl und moralische Grenzfragen in Spannung hält."
  - "Ausgebildete Pianistin, preisgekrönte TV-Schauspielerin und Kurzfilmemacherin: Anna Pieri Zürcher steht für eine Karriere, die weit über eine einzige Rolle hinausgeht."
  - "Mit dem Schweizer Fernsehfilmpreis 2019 und der Filmpreis-Nominierung 2026 ist sie eine der meistbeachteten Schweizer Schauspielerinnen ihrer Generation."
